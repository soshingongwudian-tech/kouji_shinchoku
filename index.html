body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Noto Sans JP',sans-serif;font-size:14px;color:#1a1a1a;background:#f5f5f5;padding-bottom:40px;}
.header{background:#185FA5;color:#fff;padding:14px 16px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2);}
.header h1{font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px;}
.header h1 svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2;}
.updated{font-size:10px;opacity:.75;margin-top:3px;}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 12px 4px;}
.metric{background:#fff;border-radius:8px;padding:8px 10px;box-shadow:0 1px 2px rgba(0,0,0,.06);}
.metric.wide{grid-column:1/-1;}
.mlabel{font-size:10px;color:#888;margin-bottom:2px;}
.mval{font-size:18px;font-weight:700;}
.mval.sky{color:#0369a1;}.mval.amber{color:#b45309;}.mval.purple{color:#5b21b6;}.mval.coral{color:#b91c1c;}.mval.green{color:#15803d;}.mval.blue{color:#185FA5;}
.metric.wide .mval{font-size:14px;}
.hoj-wrap{padding:8px 12px 0;}
.hoj-card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.1);border-left:5px solid #dc2626;}
.hoj-hdr{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;cursor:pointer;}
.hoj-hdr:active{background:#fef2f2;}
.hoj-title{font-size:13px;font-weight:700;color:#dc2626;display:flex;align-items:center;gap:6px;}
.hoj-cnt{font-size:11px;background:#fee2e2;color:#991b1b;padding:2px 8px;border-radius:999px;font-weight:600;}
.hoj-list{border-top:1px solid #fee2e2;}
.hoj-item{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:10px 14px;border-bottom:1px solid #fef2f2;cursor:pointer;}
.hoj-item:last-child{border-bottom:none;}
.hoj-item:active{background:#fef2f2;}
.hoj-name{font-size:13px;font-weight:600;margin-bottom:2px;}
.hoj-content{font-size:11px;color:#666;line-height:1.4;}
.hoj-status{font-size:10px;white-space:nowrap;padding:2px 7px;border-radius:999px;font-weight:600;}
.hoj-done{background:#dcfce7;color:#166534;}.hoj-pending{background:#fef3c7;color:#92400e;}
.tab-wrap{padding:8px 12px 0;}
.tabs{display:flex;background:#e0e0e0;border-radius:10px;padding:3px;}
.tab{flex:1;padding:7px 4px;border:none;background:none;cursor:pointer;color:#555;font-size:12px;text-align:center;border-radius:8px;font-weight:500;}
.tab.active{background:#fff;color:#185FA5;box-shadow:0 1px 3px rgba(0,0,0,.15);}
.search-area{padding:8px 12px;}
.search-area input{width:100%;font-size:18px;padding:16px 20px;border-radius:14px;border:2.5px solid #185FA5;background:#fff;outline:none;margin-bottom:6px;box-shadow:0 3px 12px rgba(24,95,165,.2);}
.filter-row{display:flex;gap:6px;}
.filter-row select{flex:1;font-size:12px;padding:8px 10px;border-radius:8px;border:1px solid #ddd;background:#fff;outline:none;}
.count-label{font-size:11px;color:#888;padding:0 14px 6px;}
.card-list{padding:0 12px;display:flex;flex-direction:column;gap:8px;}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08);cursor:pointer;display:flex;}
.card:active{opacity:.85;}
.card-accent{width:5px;flex-shrink:0;}
.ac-koujic{background:#f59e0b;}.ac-koujim{background:#3b82f6;}.ac-mitsumori{background:#8b5cf6;}
.ac-kanko{background:#10b981;}.ac-hojokin{background:#06b6d4;}.ac-done{background:#94a3b8;}
.ac-shicchuu{background:#ef4444;}.ac-cancel{background:#94a3b8;}.ac-mikaishuu{background:#f97316;}.ac-other{background:#ec4899;}

.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:4px;}
.card-name{font-size:14px;font-weight:600;flex:1;line-height:1.3;}
.badge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:10px;font-weight:600;white-space:nowrap;}
.b-koujic{background:#fef3c7;color:#92400e;}.b-koujim{background:#dbeafe;color:#1e40af;}
.b-mitsumori{background:#ede9fe;color:#5b21b6;}.b-kanko{background:#dcfce7;color:#166534;}
.b-hojokin{background:#d1fae5;color:#065f46;}.b-done{background:#f1f5f9;color:#334155;}

.b-mikaishuu{background:#fef0c7;color:#92400e;}.b-other{background:#fce7f3;color:#9d174d;}
.card-addr{font-size:11px;color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px;}
.card-summary{font-size:12px;color:#555;margin-bottom:6px;line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.card-footer{display:flex;justify-content:space-between;align-items:center;}
.card-amount{font-size:13px;font-weight:600;}
.card-meta{display:flex;align-items:center;gap:5px;}
.sub-badge{font-size:10px;font-weight:700;color:#dc2626;background:#fee2e2;padding:2px 6px;border-radius:999px;}
.card-date{font-size:11px;color:#999;}
.empty{text-align:center;padding:40px 20px;color:#aaa;font-size:13px;}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;overflow-y:auto;}
.modal-overlay.open{display:block;}
.modal{background:#fff;min-height:100%;padding-bottom:60px;}
.modal-header{background:#185FA5;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;position:sticky;top:0;}
.modal-name{font-size:15px;font-weight:600;flex:1;line-height:1.3;margin-top:6px;}
.close-btn{background:rgba(255,255,255,.2);border:none;color:#fff;padding:6px 14px;border-radius:8px;font-size:13px;cursor:pointer;white-space:nowrap;margin-top:6px;}
.modal-body{padding:0 16px 20px;}
.sec{font-size:11px;font-weight:700;color:#185FA5;padding:14px 0 6px;border-bottom:1px solid #dbeafe;margin-bottom:4px;}
.drow{padding:10px 0;border-bottom:1px solid #f0f0f0;}
.drow:last-child{border-bottom:none;}
.dlabel{font-size:11px;color:#999;margin-bottom:3px;}
.dval{font-size:14px;word-break:break-word;line-height:1.6;}
.dval a{color:#185FA5;text-decoration:none;}
.dval.red{color:#dc2626;font-weight:600;}
.dval.green{color:#15803d;font-weight:700;}
.inv-block{background:#f8f9fa;border-radius:10px;padding:10px 12px;margin-bottom:8px;}
.inv-title{font-size:13px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.inv-row{display:flex;gap:8px;margin-bottom:4px;font-size:12px;}

.inv-val{word-break:break-word;flex:1;}

.dot.done{background:#15803d;}.dot.none{background:#d1d5db;}.dot.pending{background:#f59e0b;}</style>

function parseAddr(raw){

  }

  var total=DATA.filter(function(d){return d["\u72b6\u614b"]==="\u5b8c\u5de5\u5165\u91d1\u6e08"&&d.sheet===THIS_TERM&&d["\u8acb\u8ca0\u91d1\u984d"];}).reduce(function(a,c){return a+c["\u8acb\u8ca0\u91d1\u984d"];},0);
  function metricCard(label,cls,status,count){
    return '<div class="metric" style="cursor:pointer" data-status="'+status+'" onclick="filterByStatus(this.dataset.status)"><div class="mlabel">'+label+'</div><div class="mval '+cls+'">'+count+'</div></div>';
  }
  document.getElementById("metrics").innerHTML=
    metricCard('受注(工事前)','sky','受注(工事前)',DATA.filter(function(d){return d["状態"]==="受注(工事前)";}).length)+
    metricCard('受注(工事中)','amber','受注(工事中)',DATA.filter(function(d){return d["状態"]==="受注(工事中)";}).length)+
    metricCard('\u898b\u7a4d\u308a\u63d0\u51fa\u6e08','purple','\u898b\u7a4d\u308a\u63d0\u51fa\u6e08',DATA.filter(function(d){return d["\u72b6\u614b"]==="\u898b\u7a4d\u308a\u63d0\u51fa\u6e08";}).length)+
    metricCard('\u5b8c\u5de5\u5165\u91d1\u524d','green','\u5b8c\u5de5\u5165\u91d1\u524d',DATA.filter(function(d){return d["\u72b6\u614b"]==="\u5b8c\u5de5\u5165\u91d1\u524d";}).length)+
    metricCard('\u6848\u4ef6','blue','\u6848\u4ef6',DATA.filter(function(d){return d["\u72b6\u614b"]==="\u6848\u4ef6";}).length)+
    metricCard('\u672a\u8acb\u6c42','coral','\u672a\u8acb\u6c42',DATA.filter(function(d){return d["\u72b6\u614b"]==="\u672a\u8acb\u6c42";}).length)+
    '<div class="metric wide"><div class="mlabel">\u5b8c\u5de5\u6e08\u91d1\u984d\u7d2f\u8a08\uff08\u4eca\u671f\u30fb\u7a0e\u8fbc\uff09</div><div class="mval green">\u00a5'+total.toLocaleString()+'</div></div>';
  renderHoj();
  var list=filterData();
  document.getElementById("count-label").textContent=list.length+"\u4ef6\u8868\u793a";
  var cl=document.getElementById("card-list");
  if(!list.length){cl.innerHTML='<div class="empty">\u8a72\u5f53\u3059\u308b\u6848\u4ef6\u304c\u3042\u308a\u307e\u305b\u3093</div>';return;}
  cl.innerHTML=list.map(function(c){
    var addr=exAddr(c["\u4f4f\u6240"]);
    var addrDiv=addr?'<div class="card-addr">&#128205; '+addr+'</div>':'';
    var sub=c["\u88dc\u52a9\u91d1"]?'<span class="sub-badge">\u88dc\u52a9\u91d1</span>':'';
    var summary=c["\u5de5\u4e8b\u6982\u8981"]?c["\u5de5\u4e8b\u6982\u8981"].replace(/\n/g,' '):'\u2014';
    if(c["\u72b6\u614b"]==="\u5931\u6ce8"&&c["\u5931\u6ce8\u7406\u7531"]){summary=c["\u5931\u6ce8\u7406\u7531"].replace(/\n/g,' ');}
    return '<div class="card" data-id="'+c.id.replace(/&/g,'&amp;').replace(/"/g,'&quot;')+'"><div class="card-accent '+ac(c["\u72b6\u614b"])+'"></div><div class="card-body"><div class="card-top"><div class="card-name">'+c["\u65bd\u4e3b\u540d"].replace(/\n/g,' ')+'</div><span class="badge '+bc(c["\u72b6\u614b"])+'">'+c["\u72b6\u614b"]+'</span></div>'+addrDiv+'<div class="card-summary">'+summary+'</div><div class="card-footer"><span class="card-amount">'+fmtAmt(c)+'</span><span class="card-meta">'+sub+'<span class="card-date">'+(c["\u5b8c\u5de5"]||c["\u5de5\u671f"]||'')+'</span></span></div></div></div>';
  }).join('');
}

function dotH(v){if(!v)return '<span class="dot none"></span>';var s=v.trim();if(s==="\u25cb"||/[0-9]{4}\/[0-9]/.test(s)||/[0-9]+\/[0-9]+/.test(s))return '<span class="dot done"></span>';return '<span class="dot pending"></span>';}
function invBlock(title,nyukin,req,limit){var paid=nyukin&&nyukin.trim();return '<div class="inv-block"><div class="inv-title">'+dotH(nyukin)+' '+title+'</div><div class="inv-row"><span class="inv-label">\u8acb\u6c42\u65e5\u30fb\u91d1\u984d</span><span class="inv-val">'+(req?req.replace(/\n/g,'<br>'):'—')+'</span></div><div class="inv-row"><span class="inv-label">\u5165\u91d1\u671f\u9650</span><span class="inv-val">'+(limit?limit.replace(/\n/g,'<br>'):'—')+'</span></div><div class="inv-row"><span class="inv-label">\u5165\u91d1</span><span class="inv-val '+(paid?'paid':'')+'">'+( nyukin?nyukin.replace(/\n/g,'<br>'):'—')+'</span></div></div>';}

function genkaHTML(c){
  var ukeoi = c.請負金額 || c.原価_請負金額;
  var genka = c.原価_合計;
  if(!genka && !ukeoi)return '';
  var profit = (ukeoi!=null && genka!=null) ? (ukeoi - genka) : null;
  var margin = (profit!=null && ukeoi) ? (profit/ukeoi*100) : null;
  var profitColor = profit!=null ? (profit>=0?'#15803d':'#dc2626') : '#999';

  function row(label,val){
    if(val===null||val===undefined)return '';
    return '<div class="inv-row"><span class="inv-label">'+label+'</span><span class="inv-val" style="font-weight:600">¥'+Number(val).toLocaleString()+'</span></div>';
  }

  var detailHTML =
    '<div class="genka-detail" id="genka-detail" style="display:none;border-top:1px solid #e5e7eb;margin-top:8px;padding-top:8px">'
    +row('請負金額',ukeoi)
    +row('材料費',c.原価_材料費)
    +row('外注費',c.原価_外注費)
    +row('現場経費',c.原価_現場経費)
    +row('入金累計',c.原価_入金累計)
    +'<div class="inv-row" style="border-top:1px solid #e5e7eb;padding-top:6px;margin-top:4px"><span class="inv-label" style="font-weight:700">支出合計</span><span class="inv-val" style="font-weight:700">'+(genka!=null?'¥'+Number(genka).toLocaleString():'—')+'</span></div>'
    +'</div>';

  return '<div class="sec">&#128202; 原価情報</div>'
    +'<div class="inv-block" id="genka-toggle" style="cursor:pointer">'
    +'<div style="display:flex;justify-content:space-between;align-items:center">'
    +'<div style="display:flex;gap:20px">'
    +'<div><div class="inv-label">利益</div><div style="font-size:18px;font-weight:700;color:'+profitColor+'">'+(profit!=null?'¥'+profit.toLocaleString():'—')+'</div></div>'
    +'<div><div class="inv-label">利益率</div><div style="font-size:18px;font-weight:700;color:'+profitColor+'">'+(margin!=null?margin.toFixed(1)+'%':'—')+'</div></div>'
    +'</div>'
    +'<span id="genka-chev" style="color:#999;font-size:12px">▼ 詳細</span>'
    +'</div>'
    +detailHTML
    +'</div>';
}

function showDetail(id){
  var c=DATA.find(function(x){return x.id===id;});
  if(!c)return;
  document.getElementById("modal-badge").innerHTML='<span class="badge '+bc(c["\u72b6\u614b"])+'" style="background:rgba(255,255,255,.25);color:#fff">'+c["\u72b6\u614b"]+'</span>';
  document.getElementById("modal-name").textContent=c["\u65bd\u4e3b\u540d"].replace(/\n/g,' ');
  var parsed=parseAddr(c["\u4f4f\u6240"]||'');
  var addrHTML='';
  if(parsed.k){addrHTML='<a href="https://maps.google.com/?q='+encodeURIComponent(parsed.k)+'" target="_blank">'+parsed.k+'</a>';if(parsed.o.length){addrHTML+=parsed.o.map(function(o){return '<div style="margin-top:8px"><span style="font-size:11px;color:#999">【'+o.label+'】</span><br>'+o.addr+'</div>';}).join('');}}
  else{addrHTML=c["\u4f4f\u6240"]?c["\u4f4f\u6240"].replace(/\n/g,'<br>'):'—';}
  var telHTML='—';
  if(c["\u96fb\u8a71\u756a\u53f7"]){
    var lines=c["\u96fb\u8a71\u756a\u53f7"].split('\n'),phones=[],i=0;
    while(i<lines.length){
      var line=lines[i].trim(),nm=line.match(/[0-9]{2,4}-[0-9]{3,4}-[0-9]{4}/);
      if(nm){var num=nm[0];var lbl=line.replace(num,'').replace(/[（）()]/g,'').trim();if(!lbl&&i+1<lines.length){var nx=lines[i+1].trim();if(nx&&!/[0-9]{2,4}-[0-9]/.test(nx)){lbl=nx.replace(/[（）()]/g,'').trim();i++;}}phones.push({num:num,lbl:lbl});}
      i++;
    }
    if(!phones.length){telHTML='<a href="tel:'+c["\u96fb\u8a71\u756a\u53f7"].replace(/[^0-9+\-]/g,'')+'" style="color:#185FA5;font-weight:600;text-decoration:none">&#128222; '+c["\u96fb\u8a71\u756a\u53f7"]+'</a>';}
    else{telHTML=phones.map(function(p){return '<div style="margin-bottom:6px"><a href="tel:'+p.num+'" style="color:#185FA5;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:6px;background:#EBF4FF;padding:6px 12px;border-radius:8px">&#128222; '+p.num+(p.lbl?' <span style="font-size:11px;color:#555;font-weight:400">'+p.lbl+'</span>':'')+'</a></div>';}).join('');}
  }
  var mailRow=(c["\u30e1\u30fc\u30eb"]&&c["\u30e1\u30fc\u30eb"]!=='-')?'<div class="drow"><div class="dlabel">\u30e1\u30fc\u30eb</div><div class="dval">'+c["\u30e1\u30fc\u30eb"]+'</div></div>':'';
  var subRow=c["\u88dc\u52a9\u91d1"]?'<div class="drow"><div class="dlabel">\u88dc\u52a9\u91d1</div><div class="dval red">'+c["\u88dc\u52a9\u91d1"].replace(/\n/g,'<br>')+'</div></div>':'';
  var shichuuRow=c["\u5931\u6ce8\u7406\u7531"]?'<div class="drow"><div class="dlabel">\u5931\u6ce8\u7406\u7531</div><div class="dval" style="color:#991b1b">'+c["\u5931\u6ce8\u7406\u7531"].replace(/\n/g,'<br>')+'</div></div>':'';
  var hasK=c["\u7740\u5de5\u91d1\u8acb\u6c42"]||c["\u7740\u5de5\u91d1\u5165\u91d1\u671f\u9650"]||c["\u7740\u5de5\u91d1\u5165\u91d1"];
  var hasF=c["\u5b8c\u5de5\u91d1\u8acb\u6c42"]||c["\u5b8c\u5de5\u91d1\u5165\u91d1\u671f\u9650"]||c["\u5b8c\u5de5\u91d1\u5165\u91d1"];
  var invHTML=(!hasK&&!hasF)?'<div class="drow"><div class="dval" style="color:#aaa;font-size:12px">\u30c7\u30fc\u30bf\u306a\u3057</div></div>':'';
  if(hasK)invHTML+=invBlock('\u7740\u5de5\u91d1',c["\u7740\u5de5\u91d1\u5165\u91d1"],c["\u7740\u5de5\u91d1\u8acb\u6c42"],c["\u7740\u5de5\u91d1\u5165\u91d1\u671f\u9650"]);
  if(hasF)invHTML+=invBlock('\u5b8c\u5de5\u91d1',c["\u5b8c\u5de5\u91d1\u5165\u91d1"],c["\u5b8c\u5de5\u91d1\u8acb\u6c42"],c["\u5b8c\u5de5\u91d1\u5165\u91d1\u671f\u9650"]);
  document.getElementById("modal-body").innerHTML=
    '<div class="sec">&#128203; \u57fa\u672c\u60c5\u5831</div>'+
    '<div class="drow"><div class="dlabel">\u5de5\u4e8b\u756a\u53f7</div><div class="dval">'+(c.id&&c.id.charAt(0)!=="_"?c.id:"—")+'</div></div>'+
    '<div class="drow"><div class="dlabel">\u671f\u9593</div><div class="dval">'+c.sheet+'</div></div>'+
    '<div class="drow"><div class="dlabel">\u521d\u56de\u53d7\u4ed8\u65e5</div><div class="dval">'+(c["\u521d\u56de\u53d7\u4ed8\u65e5"]||'—')+'</div></div>'+
    '<div class="drow"><div class="dlabel">\u7d4c\u7def</div><div class="dval">'+(c["\u7d4c\u7def"]||'—')+'</div></div>'+
    '<div class="sec">&#127968; \u65bd\u4e3b\u30fb\u9023\u7d61\u5148</div>'+
    '<div class="drow"><div class="dlabel">\u5de5\u4e8b\u5834\u6240</div><div class="dval">'+addrHTML+'</div></div>'+
    '<div class="drow"><div class="dlabel">\u96fb\u8a71\u756a\u53f7</div><div class="dval">'+telHTML+'</div></div>'+
    mailRow+
    '<div class="sec">&#128296; \u5de5\u4e8b\u5185\u5bb9</div>'+
    '<div class="drow"><div class="dlabel">\u5de5\u4e8b\u6982\u8981</div><div class="dval">'+(c["\u5de5\u4e8b\u6982\u8981"]||'—').replace(/\n/g,'<br>')+'</div></div>'+
    '<div class="drow"><div class="dlabel">\u898b\u7a4d\u30fb\u91d1\u984d</div><div class="dval">'+(c["\u898b\u7a4d"]||'—').replace(/\n/g,'<br>')+'</div></div>'+
    '<div class="drow"><div class="dlabel">\u5de5\u671f</div><div class="dval">'+(c["\u5de5\u671f"]||'—')+'</div></div>'+
    '<div class="drow"><div class="dlabel">\u5b8c\u5de5</div><div class="dval">'+(c["\u5b8c\u5de5"]||'—')+'</div></div>'+
    '<div class="sec">&#128180; \u91d1\u984d\u30fb\u88dc\u52a9\u91d1</div>'+
    '<div class="drow"><div class="dlabel">\u6700\u7d42\u8acb\u8ca0\u91d1\u984d\uff08\u7a0e\u8fbc\uff09</div><div class="dval green">'+(c["\u8acb\u8ca0\u91d1\u984d"]?'\u00a5'+Number(c["\u8acb\u8ca0\u91d1\u984d"]).toLocaleString():'—')+'</div></div>'+
    subRow+
    shichuuRow+
    '<div class="sec">&#129534; \u8acb\u6c42\u30fb\u5165\u91d1\u72b6\u6cc1</div>'+
    invHTML+genkaHTML(c);
  var genkaToggle=document.getElementById("genka-toggle");
  if(genkaToggle){
    var genkaOpen=false;
    genkaToggle.addEventListener("click",function(){
      genkaOpen=!genkaOpen;
      document.getElementById("genka-detail").style.display=genkaOpen?"block":"none";
      document.getElementById("genka-chev").textContent=genkaOpen?"▲ 詳細":"▼ 詳細";
    });
  }
  document.getElementById("modal-overlay").classList.add("open");
  document.getElementById("modal-overlay").scrollTop=0;
}

function closeModal(){document.getElementById("modal-overlay").classList.remove("open");}

var statusSet=[...new Set(DATA.map(function(d){return d["\u72b6\u614b"];}))];
var fs=document.getElementById("fstatus");
STATUS_ORDER.forEach(function(s){if(statusSet.includes(s)){var o=document.createElement("option");o.value=s;o.textContent=s;fs.appendChild(o);}});
fs.onchange=render;
var sheetSet=[...new Set(DATA.map(function(d){return d.sheet;}))];
var fsh=document.getElementById("fsheet");
sheetSet.forEach(function(s){var o=document.createElement("option");o.value=s;o.textContent=s;fsh.appendChild(o);});
fsh.onchange=render;
var tabDefs=[{id:"all",label:"\u5168\u4ef6"},{id:"anken",label:"\u6848\u4ef6"},{id:"mitsumori",label:"\u898b\u7a4d\u6e08"},{id:"mae",label:"\u5de5\u4e8b\u524d"},{id:"chu",label:"\u5de5\u4e8b\u4e2d"},{id:"misei",label:"\u672a\u8acb\u6c42"},{id:"kankoumae",label:"\u5b8c\u5de5\u5165\u91d1\u524d"},{id:"won",label:"\u5b8c\u5de5"}];
var tabsEl=document.getElementById("tabs");
tabDefs.forEach(function(t){var b=document.createElement("button");b.className="tab"+(t.id===tab?" active":"");b.textContent=t.label;b.onclick=function(){tab=t.id;document.querySelectorAll(".tab").forEach(function(x){x.classList.remove("active");});b.classList.add("active");render();window.scrollTo(0,0);};tabsEl.appendChild(b);});
document.getElementById("card-list").addEventListener("click",function(e){var card=e.target.closest(".card");if(card)showDetail(card.dataset.id);});
document.getElementById("search").addEventListener("input",render);
render();

</script>
